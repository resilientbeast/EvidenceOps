name: evidenceops

services:
  app:
    image: evidenceops:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      HOME: /home/node
      NODE_ENV: production
      PORT: 3000
      VINEXT_TRUST_PROXY: "1"
      VINEXT_TRUSTED_HOSTS: evidenceops.example
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      # ccloud uses a human CockroachDB Cloud session. The host's authenticated
      # config is mounted read-only; the application invokes only its fixed,
      # read-only `cluster info` command.
      - ${CCLOUD_AUTH_DIR:-/home/ubuntu/.config/cockroachdb}:/home/node/.config/cockroachdb:ro
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
